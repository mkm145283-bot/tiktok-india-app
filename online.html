<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BharatShorts — Online</title>
  <style>
    :root{--pink:#ff1753;--bg:#090909;--card:#171717;--muted:#aaa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Arial,sans-serif}header{height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid #292929;position:sticky;top:0;background:#090909eF;z-index:3}.brand{font-size:22px;font-weight:800;color:var(--pink)}button{border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer;background:var(--pink);color:white}.ghost{background:#292929}.layout{max-width:1180px;margin:auto;display:grid;grid-template-columns:220px minmax(0,620px) 240px;gap:20px;padding:20px}.side{position:sticky;top:82px;height:max-content}.nav{display:block;width:100%;text-align:left;background:transparent;margin:4px 0;font-size:15px}.nav:hover,.selected{background:#242424}.panel,.video{background:var(--card);border:1px solid #292929;border-radius:12px;padding:14px;margin-bottom:14px}.video video{width:100%;max-height:650px;background:#000;border-radius:9px;display:block}.meta{display:flex;gap:10px;align-items:center;margin:12px 0}.avatar{width:38px;height:38px;border-radius:50%;background:var(--pink);display:grid;place-items:center;font-weight:bold}.muted{color:var(--muted);font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{background:#292929}.actions button.active{background:var(--pink)}input{width:100%;padding:11px;background:#111;border:1px solid #444;color:#fff;border-radius:7px;margin:5px 0}h3{margin-top:0}.hidden{display:none}.empty{text-align:center;color:var(--muted);padding:45px 10px}.tag{color:#ff668d}.progress{height:5px;background:#333;margin-top:8px}.progress i{display:block;height:100%;width:0;background:var(--pink)}dialog{background:#181818;color:#fff;border:1px solid #555;border-radius:12px;max-width:420px;width:92%}dialog::backdrop{background:#000b}.error{color:#ff7c9b;font-size:13px}@media(max-width:850px){.layout{display:block;padding:10px}.side{position:static;display:none}.video video{max-height:75vh}.brand{font-size:18px}}
  </style>
</head>
<body>
<header><div class="brand">🇮🇳 BharatShorts</div><div><span id="userLabel" class="muted">Guest</span> <button id="loginBtn">Login</button><button id="logoutBtn" class="ghost hidden">Logout</button></div></header>
<div class="layout"><aside class="side"><div class="panel"><button class="nav selected">🏠 For You</button><button class="nav">🔥 Trending</button><button class="nav">👤 Profile</button><button class="nav" id="uploadNav">＋ Upload video</button></div><div class="panel muted">Real online features use your Firebase project. Read the setup guide before publishing.</div></aside>
<main><div id="feed"><div class="empty">Loading videos…</div></div></main>
<aside class="side"><div class="panel"><h3>भारत में ट्रेंडिंग</h3><p class="tag">#India</p><p class="tag">#Comedy</p><p class="tag">#Dance</p><p class="tag">#Cricket</p><p class="tag">#Music</p></div></aside></div>
<dialog id="authDialog"><h3>Account</h3><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password (6+ characters)"><div class="actions"><button id="signup">Create account</button><button id="signin">Login</button><button class="ghost" onclick="authDialog.close()">Cancel</button></div><p id="authError" class="error"></p></dialog>
<dialog id="uploadDialog"><h3>वीडियो अपलोड करें</h3><input id="caption" placeholder="Caption और hashtags"><input id="videoFile" type="file" accept="video/mp4,video/webm,video/quicktime"><div class="progress"><i id="bar"></i></div><p id="uploadStatus" class="muted"></p><div class="actions"><button id="uploadBtn">Upload</button><button class="ghost" onclick="uploadDialog.close()">Cancel</button></div></dialog>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js';
import {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut} from 'https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js';
import {getFirestore,collection,query,orderBy,onSnapshot,addDoc,doc,updateDoc,increment} from 'https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js';
import {getStorage,ref,uploadBytesResumable,getDownloadURL} from 'https://www.gstatic.com/firebasejs/12.3.0/firebase-storage.js';
// Replace every value with your Firebase Web App config.
const firebaseConfig={apiKey:'YOUR_API_KEY',authDomain:'YOUR_PROJECT.firebaseapp.com',projectId:'YOUR_PROJECT_ID',storageBucket:'YOUR_PROJECT.firebasestorage.app',messagingSenderId:'YOUR_SENDER_ID',appId:'YOUR_APP_ID'};
const configured=!firebaseConfig.apiKey.startsWith('YOUR_');
const feed=document.querySelector('#feed');let currentUser=null;
function showSetup(){feed.innerHTML='<div class="panel empty"><h3>Firebase setup required</h3><p>इस file में firebaseConfig की values भरकर Firebase Authentication, Firestore और Storage enable करें।</p><a href="README.md" class="tag">Setup guide देखें</a></div>'}
if(!configured){showSetup()}else{
 const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),storage=getStorage(app);
 onAuthStateChanged(auth,u=>{currentUser=u;userLabel.textContent=u?u.email:'Guest';loginBtn.classList.toggle('hidden',!!u);logoutBtn.classList.toggle('hidden',!u);});
 loginBtn.onclick=()=>authDialog.showModal();logoutBtn.onclick=()=>signOut(auth);
 signup.onclick=async()=>{authError.textContent='';try{await createUserWithEmailAndPassword(auth,email.value,password.value);authDialog.close()}catch(e){authError.textContent=e.message}};
 signin.onclick=async()=>{authError.textContent='';try{await signInWithEmailAndPassword(auth,email.value,password.value);authDialog.close()}catch(e){authError.textContent=e.message}};
 uploadNav.onclick=()=>currentUser?uploadDialog.showModal():authDialog.showModal();
 const q=query(collection(db,'videos'),orderBy('createdAt','desc'));
 onSnapshot(q,snap=>{feed.innerHTML='';if(snap.empty){feed.innerHTML='<div class="empty">पहली video upload करें।</div>';return}snap.forEach(s=>renderVideo(s.id,s.data()))},e=>feed.innerHTML='<div class="empty error">Feed error: '+e.message+'</div>');
 function renderVideo(id,v){const el=document.createElement('article');el.className='video';el.innerHTML=`<video controls playsinline preload="metadata" src="${v.url}"></video><div class="meta"><div class="avatar">${(v.ownerEmail||'U')[0].toUpperCase()}</div><div><b>${v.ownerEmail||'User'}</b><div class="muted">${v.caption||''}</div></div></div><div class="actions"><button data-like>❤️ ${v.likes||0}</button><button data-comment>💬 Comment</button><button data-share>↗ Share</button></div><div class="muted" data-comments></div>`;el.querySelector('[data-like]').onclick=async()=>updateDoc(doc(db,'videos',id),{likes:increment(1)});el.querySelector('[data-share]').onclick=async()=>{await navigator.clipboard?.writeText(v.url);alert('Video link copied')};el.querySelector('[data-comment]').onclick=()=>{const text=prompt('Comment लिखें');if(text&&currentUser)addDoc(collection(db,'videos',id,'comments'),{text,userId:currentUser.uid,createdAt:Date.now()})};feed.append(el)}
 uploadBtn.onclick=()=>{if(!currentUser)return authDialog.showModal();const file=videoFile.files[0];if(!file||!file.type.startsWith('video/'))return uploadStatus.textContent='कृपया video file चुनें';if(file.size>100*1024*1024)return uploadStatus.textContent='Maximum file size 100 MB है';const task=uploadBytesResumable(ref(storage,`videos/${currentUser.uid}/${Date.now()}-${file.name}`),file);task.on('state_changed',s=>{bar.style.width=(s.bytesTransferred/s.totalBytes*100)+'%';uploadStatus.textContent='Uploading…'},async()=>{const url=await getDownloadURL(task.snapshot.ref);await addDoc(collection(db,'videos'),{url,caption:caption.value,ownerId:currentUser.uid,ownerEmail:currentUser.email,likes:0,createdAt:Date.now()});uploadStatus.textContent='Uploaded';setTimeout(()=>uploadDialog.close(),600)},e=>uploadStatus.textContent=e.message)}
}
</script></body></html>
